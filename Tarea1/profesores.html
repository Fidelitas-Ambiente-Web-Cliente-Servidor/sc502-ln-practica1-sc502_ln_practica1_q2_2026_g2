<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profesores</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="profesores.css">
</head>
<body>

    <!-- ENCABEZADO -->
    <header class="encabezado text-center">
        <h1>Nuestros Profesores</h1>
        <p>Conoce al equipo académico de nuestra institución</p>
    </header>

    <!-- SECCIÓN PROFESORES -->
    <div class="container my-5">
    <div class="row g-4" id="contenedorProfesores">
        
    </div>
</div>

    </div>

    <!-- MISIÓN Y VISIÓN -->
    <section class="info container my-5">

        <div class="row">

            <div class="col-md-6">
                <div class="caja-info">
                    <h2>Misión</h2>

                    <p>
                        Formar estudiantes con excelencia académica y valores
                        profesionales para el mundo laboral.
                    </p>
                </div>
            </div>

            <div class="col-md-6">
                <div class="caja-info">
                    <h2>Visión</h2>

                    <p>
                        Ser una institución reconocida por la innovación,
                        calidad educativa y desarrollo tecnológico.
                    </p>
                </div>
            </div>

        </div>

    </section>

    <!-- MODAL -->
    <div class="modal fade" id="profesorModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalNombre"></h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>
                </div>

                <div class="modal-body" id="modalContenido">
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="profesores.js"></script>

</body>
</html>
